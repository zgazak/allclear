name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        # pytest and pytest-cov live in the `dev` extra; plain `uv sync`
        # skips extras and leaves `uv run pytest` with nothing to run.
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: uv run pytest allclear/tests/ -v --cov=allclear --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    # Packaging check: catches a broken build or bad metadata on a PR rather
    # than mid-release, when the GitHub Release is already public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build distributions
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Load the bundled catalog from the installed wheel
        # Shipped code reads allclear/data/hipparcos_bright.ecsv. An editable
        # checkout always finds it; only a non-editable install proves the
        # wheel actually ships it. Run from /tmp so the checkout's allclear/
        # cannot shadow the installed package.
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/allclear --help > /dev/null
          /tmp/wheel-check/bin/python -c "
          from allclear.catalog import BrightStarCatalog, CATALOG_PATH
          assert CATALOG_PATH.is_file(), CATALOG_PATH
          n = len(BrightStarCatalog().table)
          assert n > 1000, n
          print(f'installed wheel loads the bundled catalog ({n} stars)')
          "
